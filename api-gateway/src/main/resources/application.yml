server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Route for Registration API
        - id: registration-api
          uri: lb://app-registration-api
          predicates:
            - Path=/api/registration/**
          filters:
            - StripPrefix=2

        # Route for Reservation API
        - id: reservation-api
          uri: lb://app-reservation-api
          predicates:
            - Path=/api/reservation/**
          filters:
            - StripPrefix=2

        # Direct routes (without prefix stripping)
        - id: registration-api-direct
          uri: lb://app-registration-api
          predicates:
            - Path=/registration/**

        - id: reservation-api-direct
          uri: lb://app-reservation-api
          predicates:
            - Path=/reservation/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
            methods: GET,POST,PUT,DELETE
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
